version: "3.9"

services:
  devopsdb:
    image: pavanreddy215/dockerweb:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  application:
    image: pavanreddy215/dockerweb:app
    ports:
      - "2222:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
